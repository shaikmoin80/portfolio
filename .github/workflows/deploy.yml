name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and inject private contact details from secrets
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
        run: |
          mkdir _site
          cp -r index.html 404.html css js assets cv _site/
          rm -f _site/js/private.local.example.js
          python3 - <<'PY'
          import os
          p = "_site/js/data.js"
          s = open(p, encoding="utf-8").read()
          s = s.replace("__SITE_EMAIL__", os.environ.get("SITE_EMAIL", ""))
          s = s.replace("__SITE_PHONE__", os.environ.get("SITE_PHONE", ""))
          open(p, "w", encoding="utf-8").write(s)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
