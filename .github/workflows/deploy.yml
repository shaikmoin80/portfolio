name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full CV (with contact details) lives in a PRIVATE repository.
      # Forks and downloads of this public repo never contain it.
      - name: Checkout private CV repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/portfolio-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-cv

      - name: Build site, inject private details and CV
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
        run: |
          set -e
          test -f private-cv/Shaik_Moin_CV_Cloud_Operations_SRE.pdf
          mkdir _site
          cp -r index.html 404.html css js assets cv .nojekyll _site/
          rm -f _site/js/private.local.example.js
          cp private-cv/Shaik_Moin_CV_Cloud_Operations_SRE.pdf _site/cv/
          python3 - <<'PY'
          import os
          p = "_site/js/data.js"
          s = open(p, encoding="utf-8").read()
          s = s.replace("__SITE_EMAIL__", os.environ.get("SITE_EMAIL", ""))
          s = s.replace("__SITE_PHONE__", os.environ.get("SITE_PHONE", ""))
          open(p, "w", encoding="utf-8").write(s)
          PY

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
